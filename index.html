<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メールアドレス拡張エイリアス生成ツール</title>
    <style>
        :root {
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --border-color: #e5e7eb;
            --success-color: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 8px;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        textarea, input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            font-family: monospace;
        }

        .grid-config {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            background-color: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            user-select: none;
            font-weight: 500;
            color: #475569;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-copy {
            background-color: var(--success-color);
            margin-top: 12px;
        }

        .btn-copy:hover {
            background-color: #059669;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .toast {
            display: none;
            text-align: center;
            padding: 10px;
            background-color: #ecfdf5;
            color: var(--success-color);
            border: 1px solid #a7f3d0;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 500;
        }

        .privacy-note {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: -10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>プラスアドレス（拡張エイリアス）一括生成ツール</h1>
        <p class="description">元のメールアドレスを、指定したランダム文字列のプラスアドレスに一括変換します。</p>
    </header>

    <div class="privacy-note">
        ※入力されたメールアドレスはブラウザ内（ローカル）でのみ処理され、外部サーバーには一切送信されません。
    </div>

    <div class="card">
        <div class="form-group">
            <label for="inputEmails">元のメールアドレス（改行区切りで複数ペースト可）</label>
            <textarea id="inputEmails" rows="6" placeholder="example@icloud.com&#10;test@gmail.com"></textarea>
        </div>

        <div class="grid-config">
            <div class="form-group">
                <label for="letterCount">英語の文字数</label>
                <input type="number" id="letterCount" min="0" value="4">
            </div>
            <div class="form-group">
                <label for="letterCase">英語の種類</label>
                <select id="letterCase">
                    <option value="lower">小文字のみ (a-z)</option>
                    <option value="upper">大文字のみ (A-Z)</option>
                    <option value="mixed">大混雑（大小混合）</option>
                </select>
            </div>
            <div class="form-group">
                <label for="digitCount">数字の文字数</label>
                <input type="number" id="digitCount" min="0" value="2">
            </div>
            <div class="form-group">
                <label for="generateCount">1アドレスあたりの生成個数</label>
                <input type="number" id="generateCount" min="1" value="3">
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="shuffleResults">
            <label for="shuffleResults">生成結果の並び順をランダムにシャffleする（並び替える）</label>
        </div>

        <button class="btn" onclick="generateAddresses()">プラスアドレスを生成する</button>
    </div>

    <div id="toast" class="toast">クリップボードにコピーしました！</div>

    <div class="card" id="outputCard" style="display: none;">
        <div class="output-header">
            <label style="margin-bottom: 0;">生成結果</label>
        </div>
        <textarea id="outputEmails" rows="10" readonly></textarea>
        <button class="btn btn-copy" onclick="copyToClipboard()">結果を一括コピーする</button>
    </div>
</div>
